name: Aurelian public native startup successor
on:
  push:
    branches: [aurelian/eval-startup-ehd6hbnA]
permissions: {}
concurrency:
  group: aurelian-startup-ehd6hbnA
  cancel-in-progress: false
jobs:
  startup-candidate:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Fetch exact public commit without credentials
        shell: bash
        env:
          TEST_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$TEST_SHA" =~ ^[0-9a-f]{40}$ ]]
          mkdir public-source
          cd public-source
          git -c credential.helper= init
          git -c credential.helper= -c core.hooksPath=/dev/null fetch --depth=2 https://github.com/caspiannacht-sudo/hermes-agent.git "$TEST_SHA"
          git -c core.hooksPath=/dev/null checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$TEST_SHA"
      - name: Install unchanged reviewed hash-pinned test-only wheels
        shell: bash
        run: |
          set -euo pipefail
          cd public-source
          PYTHON="$RUNNER_TOOL_CACHE/Python/3.11.9/arm64/bin/python3"
          test -x "$PYTHON"
          "$PYTHON" -I -c 'import sys; print(sys.version); assert sys.version_info[:3] == (3, 11, 9)'
          "$PYTHON" -m venv .test-env
          .test-env/bin/python -m pip --isolated install --no-deps --only-binary :all: --require-hashes -r ci/banner-requirements.txt
      - name: Native startup successor only
        shell: bash
        run: |
          set -euo pipefail
          cd public-source
          .test-env/bin/python -I -B ci/run_startup_candidate.py
